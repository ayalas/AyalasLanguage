name: Release APK
on:
  push:
    tags:
      - 'v*-app' # Trigger on tags starting with v (e.g., v1.0.1) and ending with -app (e.g., v1.0.1-app)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Matching your successful EAS build config
          cache: 'pnpm'

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🚀 Build APK on EAS
        id: build
        working-directory: apps/ayalaslanguageapp
        run: |
          # The --json flag captures the build metadata
          # The --non-interactive flag is required for CI
          # We use jq to extract the download URL from the JSON output
          BUILD_JSON=$(eas build --platform android --profile preview --non-interactive --json)
          DOWNLOAD_URL=$(echo $BUILD_JSON | jq -r '.[0].artifacts.applicationArchiveUrl')
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

      - name: 📥 Download APK
        run: curl -L -o ayalas-app.apk ${{ env.DOWNLOAD_URL }}

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ayalas-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}