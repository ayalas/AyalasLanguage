<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>langapp.xyz</title>
    <script>
      // Create a global variable to store the event
      window.deferredPrompt = null;

      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent the default mini-infobar on mobile
        e.preventDefault();
        // Save the event so React can use it later
        window.deferredPrompt = e;
        // Dispatch a custom event so the hook can react immediately if it's already mounted
        window.dispatchEvent(new Event('pwa-prompt-available'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
